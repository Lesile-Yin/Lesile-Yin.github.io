const items = DB.items;
const hs = DB.hongsong;

const grid = document.getElementById('grid');
const featuredBox = document.getElementById('featured');
const qEl = document.getElementById('q');
const tabs = document.getElementById('tabs');
const sortEl = document.getElementById('sort');

let filter = 'all';

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderFeatured(){
  const v = items.find(i=>i.num===1);
  if(!v) { featuredBox.innerHTML=''; return; }
  const btn = v.search
    ? `<a href="${esc(v.link)}" target="_blank" rel="noopener">在 GoodShort 搜索 ↗</a>`
    : `<a href="${esc(v.link)}" target="_blank" rel="noopener">观看剧集 ↗</a>`;
  const d = (v.data||'').split('|').map(s=>s.trim()).filter(Boolean);
  featuredBox.innerHTML = `
    <div class="featured">
      <div class="ficon">🧛</div>
      <div style="flex:1;min-width:260px">
        <h2>《${esc(v.cn)}》</h2>
        <div class="feng">${esc(v.eng)}</div>
        <div class="fdata">
          ${d.map(x=>{const[a,b]=x.split('：');return `<div><b>${esc(b||a)}</b><span>${esc(a)}</span></div>`}).join('')}
        </div>
        ${btn}
      </div>
    </div>`;
}

function cardHTML(it){
  const badge = it.search ? '<span class="badge search">平台搜索</span>' : '<span class="badge live">剧集主页</span>';
  const link = it.search
    ? `<a class="openlink searchbtn" href="${esc(it.link)}" target="_blank" rel="noopener">在 GoodShort 搜索 ↗</a>`
    : `<a class="openlink" href="${esc(it.link)}" target="_blank" rel="noopener">观看剧集 ↗</a>`;
  const eng = it.eng ? `<div class="eng">${esc(it.eng)}</div>` : '';
  const metrics = it.data ? `<div class="metrics">${esc(it.data)}</div><div class="more">点击展开端内数据 ▾</div>` : '<div class="more">—</div>';
  return `<div class="card" data-num="${it.num}">
    <div class="chead"><span class="idx">#${it.num}</span>${badge}</div>
    <h3>《${esc(it.cn)}》</h3>
    ${eng}
    ${metrics}
    ${link}
  </div>`;
}

function render(){
  const q = qEl.value.trim().toLowerCase();
  let list = items.filter(it=>{
    if(filter==='feature' && it.sec!=='feature') return false;
    if(filter==='ai' && it.sec!=='ai') return false;
    if(filter==='hong') return false;
    if(q){
      const hay = (it.cn+' '+it.eng+' '+it.data).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(sortEl.value==='numd') list = list.slice().reverse();

  // hong block when filter==hong
  if(filter==='hong'){
    grid.innerHTML = `<div class="card hong" style="cursor:default">
      <div class="chead"><span class="idx">红果</span><span class="badge live" style="background:#b32;color:#ffd">红果平台</span></div>
      <h3>《${esc(hs.cn)}》</h3>
      <div class="metrics" style="display:block">${esc(hs.heat)}</div>
      <a class="openlink" style="display:inline-block" href="${esc(hs.link)}" target="_blank" rel="noopener">查看 ↗</a>
    </div>`;
  } else {
    grid.innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="empty">没有匹配的作品</div>';
  }

  // stats
  document.getElementById('s-total').textContent = filter==='all'?items.length:(filter==='hong'?1:list.length);
  document.getElementById('s-live').textContent = items.filter(i=>!i.search).length;
  document.getElementById('s-search').textContent = items.filter(i=>i.search).length;
}

// events
qEl.addEventListener('input', render);
sortEl.addEventListener('change', render);
tabs.addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  [...tabs.children].forEach(c=>c.classList.remove('active'));
  t.classList.add('active');
  filter = t.dataset.f;
  featuredBox.style.display = (filter==='all') ? 'block' : 'none';
  render();
});
grid.addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  if(e.target.tagName==='A') return; // don't toggle when clicking link
  card.classList.toggle('open');
  const m = card.querySelector('.more');
  if(m) m.textContent = card.classList.contains('open') ? '收起 ▴' : '点击展开端内数据 ▾';
});

renderFeatured();
render();
</script>

</html>
